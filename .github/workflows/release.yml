name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release-assets:
    name: Build Archives And Publish Release Assets
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate release archives and manifest
        run: python3 scripts/release.py --tag "$RELEASE_TAG"

      - name: Publish archives and manifest to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release.py --tag "$RELEASE_TAG" --upload

  release-installers:
    name: Build And Upload Installer (${{ matrix.label }})
    needs: release-assets
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows
            runner: windows-latest
            binary: target/release/minecraft-sync.exe
            asset_name: minecraft-sync-windows.exe
          - label: macos
            runner: macos-latest
            binary: target/release/minecraft-sync
            asset_name: minecraft-sync-macos
          - label: linux
            runner: ubuntu-latest
            binary: target/release/minecraft-sync
            asset_name: minecraft-sync-linux
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release installer
        run: cargo build --release

      - name: Stage installer asset
        shell: bash
        run: cp "${{ matrix.binary }}" "${{ matrix.asset_name }}"

      - name: Upload installer to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" "${{ matrix.asset_name }}" --clobber
