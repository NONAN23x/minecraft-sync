[package]
name = "minecraft-sync"
version = "0.2.0"
edition = "2024"
description = "Minimal installer for a curated Minecraft modpack"

[dependencies]
anyhow = "1.0"
owo-colors = "4.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.15"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
